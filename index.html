<style>
:root {
  --bg: #0d1015; --bg2: #11151c; --surface: #171c25; --surface2: #1e2531; --line: #2a3341;
  --text: #eef2f6; --muted: #9aa7b5; --faint: #6b7787;
  --accent: #f2b86b; --accent-ink: #1b1206; --accent2: #e98aa8;
  --good: #5fd49a; --warn: #f3c34f; --bad: #ff7b7b; --info: #7fb3ff;
  --radius: 16px; --gap: 14px;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f3ee; --bg2: #efebe4; --surface: #ffffff; --surface2: #f3efe8; --line: #e2dbd0;
    --text: #1c1f24; --muted: #5d6673; --faint: #8a93a0; --accent: #c9822a; --accent-ink: #ffffff; --accent2: #c2577c;
    --good: #1f9d62; --warn: #b7860b; --bad: #d64545; --info: #2d6fd6; --shadow: 0 6px 20px rgba(60,40,10,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f3ee; --bg2: #efebe4; --surface: #ffffff; --surface2: #f3efe8; --line: #e2dbd0;
  --text: #1c1f24; --muted: #5d6673; --faint: #8a93a0; --accent: #c9822a; --accent-ink: #ffffff; --accent2: #c2577c;
  --good: #1f9d62; --warn: #b7860b; --bad: #d64545; --info: #2d6fd6; --shadow: 0 6px 20px rgba(60,40,10,.10);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 750; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13.5px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 70%, transparent); padding: calc(12px + env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 15px; color: var(--accent); }
.screen { display: flex; flex-direction: column; gap: var(--gap); padding-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.hero { background: linear-gradient(160deg, var(--surface2), var(--surface)); }
.card h2 + p, .card h3 + p { margin-top: 6px; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 13px 16px; min-height: 48px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, background .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 18px; }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: 14px; border-radius: 11px; white-space: nowrap; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.good { background: color-mix(in srgb, var(--good) 22%, var(--surface2)); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.btn.warnb { background: color-mix(in srgb, var(--warn) 20%, var(--surface2)); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn.badb { background: color-mix(in srgb, var(--bad) 18%, var(--surface2)); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.iconbtn { appearance: none; border: 0; background: var(--surface2); width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface2); padding: 7px 12px; border-radius: 999px; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.tag.accent { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; }
.tab { appearance: none; border: 0; background: transparent; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 6px 8px; min-width: 60px; cursor: pointer; border-radius: 12px; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }

/* progression du programme */
.weeks { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.weeks i { height: 8px; border-radius: 3px; background: var(--surface2); }

<body>
<div id="app"><p style="padding:40px 20px;color:#9aa7b5">Chargement…</p></div>
<noscript><p style="padding:20px">TIMBRE a besoin de JavaScript.</p></noscript>
<script>
window.TB = window.TB || {}; TB.VERSION = "1.1 · 2026-10-01";

/* ==== dsp.js ==== */
/* ============================================================================
   TIMBRE — moteur d'analyse vocale (traitement du signal pur, sans DOM)
   Détection de hauteur : YIN (de Cheveigné & Kawahara 2002) + recherche de
   chemin de type Viterbi sur les candidats (à la Boersma 1993 / pYIN).
   Qualité de voix : H1-H2 (fermeture glottique), CPPS (Hillenbrand 1996),
   brillance (Singing Power Ratio, Omori 1996).
   ========================================================================== */
(function (root) {
  'use strict';
  const TB = root.TB || (root.TB = {});
  const D = {};

  /* ---------------------------------------------------------------- musique */
  const NOTE_FR = ['Do', 'Do♯', 'Ré', 'Ré♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Si'];
  const hzToMidi = f => 69 + 12 * Math.log2(f / 440);
  const midiToHz = m => 440 * Math.pow(2, (m - 69) / 12);
  function noteName(m) {
    if (m == null || !isFinite(m)) return '—';
    const r = Math.round(m);
    return NOTE_FR[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1);
  }
  D.NOTE_FR = NOTE_FR; D.hzToMidi = hzToMidi; D.midiToHz = midiToHz; D.noteName = noteName;

  /* --------------------------------------------------------------- outils */
  function median(arr) {
    const a = Array.from(arr).filter(v => isFinite(v)).sort((x, y) => x - y);
    const n = a.length; if (!n) return NaN;
    return n % 2 ? a[(n - 1) >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }
  function mean(arr) { let s = 0, n = 0; for (const v of arr) if (isFinite(v)) { s += v; n++; } return n ? s / n : NaN; }
  function std(arr) {
    const m = mean(arr); let s = 0, n = 0;
    for (const v of arr) if (isFinite(v)) { s += (v - m) * (v - m); n++; }
    return n > 1 ? Math.sqrt(s / (n - 1)) : NaN;
  }
  function percentile(arr, p) {
    const a = Array.from(arr).filter(v => isFinite(v)).sort((x, y) => x - y);
    if (!a.length) return NaN;
    const i = Math.min(a.length - 1, Math.max(0, Math.round(p * (a.length - 1))));
    return a[i];
  }
  D.median = median; D.mean = mean; D.std = std; D.percentile = percentile;

  /* ------------------------------------------------------------------ FFT */
  const plans = new Map();
  function plan(n) {
    let p = plans.get(n); if (p) return p;
    const lv = Math.round(Math.log2(n));
    if ((1 << lv) !== n) throw new Error('FFT : taille non puissance de 2');
    const rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) { let r = 0, x = i; for (let b = 0; b < lv; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
    const cos = new Float64Array(n >> 1), sin = new Float64Array(n >> 1);
    for (let i = 0; i < n >> 1; i++) { cos[i] = Math.cos(2 * Math.PI * i / n); sin[i] = Math.sin(2 * Math.PI * i / n); }
    p = { rev, cos, sin }; plans.set(n, p); return p;
  }
  /** FFT complexe en place (re, im : Float64Array de même taille, puissance de 2). */
  function fft(re, im, inverse) {
    const n = re.length, p = plan(n);
    for (let i = 0; i < n; i++) {
      const j = p.rev[i];
      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = 0, k = 0; j < half; j++, k += step) {
          const wr = p.cos[k], wi = inverse ? p.sin[k] : -p.sin[k];
          const a = i + j, b = a + half;
          const tr = re[b] * wr - im[b] * wi, ti = re[b] * wi + im[b] * wr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
    }
    if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  D.fft = fft;

  const winCache = new Map();
  function hann(n) {
    const k = 'h' + n; let w = winCache.get(k);
    if (!w) { w = new Float64Array(n); for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1)); winCache.set(k, w); }
    return w;
  }
  /** Spectre de magnitude en dB d'un segment (fenêtre de Hann, zéro-padding). */
  function spectrumDb(x, start, len, nfft) {
    const re = new Float64Array(nfft), im = new Float64Array(nfft), w = hann(len);
    for (let i = 0; i < len; i++) re[i] = (x[start + i] || 0) * w[i];
    fft(re, im, false);
    const out = new Float64Array(nfft >> 1);
    for (let k = 0; k < nfft >> 1; k++) out[k] = 10 * Math.log10(re[k] * re[k] + im[k] * im[k] + 1e-20);
    return out;
  }
  D.spectrumDb = spectrumDb;

  /* -------------------------------------------------------- rééchantillonnage */
  /** Rééchantillonnage à sinus cardinal fenêtré (Blackman), anti-repliement inclus. */
  function resample(x, fsIn, fsOut) {
    if (fsIn === fsOut) return Float32Array.from(x);
    const r = fsIn / fsOut;                       // pas en échantillons d'entrée
    const fc = 0.45 / Math.max(1, r);             // coupure (cycles/échantillon d'entrée)
    const half = Math.ceil(10 * Math.max(1, r));  // demi-largeur du noyau
    const TABLE = 64;                             // sous-pas de la table
    const tlen = half * TABLE + 2, table = new Float64Array(tlen);
    for (let i = 0; i < tlen; i++) {
      const t = i / TABLE, s = t === 0 ? 1 : Math.sin(2 * Math.PI * fc * t) / (2 * Math.PI * fc * t);
      const wv = t >= half ? 0 : 0.42 + 0.5 * Math.cos(Math.PI * t / half) + 0.08 * Math.cos(2 * Math.PI * t / half);
      table[i] = 2 * fc * s * wv;
    }
    const nOut = Math.floor((x.length - 1) / r) + 1, y = new Float32Array(nOut);
    for (let n = 0; n < nOut; n++) {
      const t = n * r, c = Math.floor(t);
      let acc = 0, wsum = 0;
      for (let k = c - half + 1; k <= c + half; k++) {
        if (k < 0 || k >= x.length) continue;
        const d = Math.abs(t - k) * TABLE, di = Math.floor(d), fr = d - di;
        if (di + 1 >= tlen) continue;
        const wv = table[di] + (table[di + 1] - table[di]) * fr;
        acc += x[k] * wv; wsum += wv;
      }
      y[n] = wsum > 0 ? acc / wsum : 0;
    }
    return y;
  }
  D.resample = resample;

  /** Passe-haut biquad (RBJ), une passe. */
  function highpass(x, fs, fc) {
    const w0 = 2 * Math.PI * fc / fs, cs = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
    const b0 = (1 + cs) / 2, b1 = -(1 + cs), b2 = (1 + cs) / 2, a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
    const y = new Float32Array(x.length);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const v = (b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  D.highpass = highpass;

  /* ------------------------------------------------ détection de hauteur */
  const FS = 16000;           // fréquence d'analyse
  const HOP = 160;            // 10 ms
  const WIN = 512;            // fenêtre d'intégration YIN (32 ms)
  D.FS = FS; D.HOP = HOP;
  const s0Center = t => t * HOP + WIN / 2;

  /* Proéminence (dB) d'un pic spectral à f par rapport aux creux à f/2 et 3f/2. */
  const SUB_NFFT = 2048, SUB_LEN = 1024, SUB_DF = FS / SUB_NFFT;
  function bandDb(S, f, rel, useMax) {
    const c = f / SUB_DF, lo = Math.max(1, Math.min(Math.floor(c * (1 - rel)), Math.round(c) - 1));
    const hi = Math.min(S.length - 1, Math.max(Math.ceil(c * (1 + rel)), Math.round(c) + 1));
    let acc = useMax ? -Infinity : 0, n = 0;
    for (let k = lo; k <= hi; k++) { if (useMax) acc = Math.max(acc, S[k]); else { acc += S[k]; n++; } }
    return useMax ? acc : acc / Math.max(1, n);
  }
  function prominence(S, f) {
    return bandDb(S, f, 0.03, true) - Math.max(bandDb(S, 0.5 * f, 0.04, false), bandDb(S, 1.5 * f, 0.04, false));
  }
  const clamp01 = v => Math.max(0, Math.min(1, v));
  function subharmonicCheck(x, center, keep) {
    const S = spectrumDb(x, center - SUB_LEN / 2, SUB_LEN, SUB_NFFT);
    // un pic ne compte que s'il est à moins de 35 dB du plus fort pic (sinon : résidu numérique)
    let maxDb = -Infinity;
    for (let k = Math.floor(60 / SUB_DF); k <= Math.ceil(2000 / SUB_DF); k++) maxDb = Math.max(maxDb, S[k]);
    for (const c of keep) {
      c.lvl = bandDb(S, c.f, 0.03, true) - maxDb;          // niveau relatif au plus fort pic
      c.prom = Math.min(prominence(S, c.f), c.lvl + 35);
    }
    for (const c of keep) {
      let pen = 0;
      for (const c2 of keep) {
        if (c2 === c) continue;
        if (c2.f > c.f) {
          // c ressemble à un sous-harmonique de c2 (f/2, f/3, f/4) : pénalité si c n'a pas de pic propre
          const m = c2.f / c.f, mr = Math.round(m);
          if (mr < 2 || mr > 4 || Math.abs(12 * Math.log2(m / mr)) > 0.5) continue;
          pen = Math.max(pen, clamp01((c2.prom - c.prom - 6) / 12) * clamp01((12 - c.prom) / 6));
        } else {
          // c ressemble à un harmonique de c2 (2f … 8f — typiquement celui que renforce le 1er formant) :
          // pénalité si c2 possède un vrai pic spectral, donc un vrai fondamental plus grave.
          // Au-delà de 4f, le fondamental doit aussi être fort (à moins de 20 dB du maximum).
          const m = c.f / c2.f, mr = Math.round(m);
          if (mr < 2 || mr > 8 || Math.abs(12 * Math.log2(m / mr)) > 0.5) continue;
          pen = Math.max(pen, clamp01((c2.prom - 12) / 8) * (mr >= 5 ? clamp01((c2.lvl + 25) / 5) : 1));
        }
      }
      c.sub = pen;
    }
  }

  /**
   * Suivi de hauteur hors ligne.
   * @param {Float32Array} x  signal à 16 kHz
   * @param {object} o  { fmin, fmax, expect:{lo,hi} (midi, optionnel), floorDb }
   * @returns {{hop:number, fs:number, n:number, f0:Float32Array, midi:Float32Array,
   *            clarity:Float32Array, db:Float32Array, voiced:Uint8Array, floorDb:number}}
   */
  function trackPitch(x, o) {
    o = o || {};
    const fmin = o.fmin || 60, fmax = o.fmax || 1100;
    const tauMax = Math.ceil(FS / fmin), tauMin = Math.floor(FS / fmax);
    const L = WIN + tauMax + 2;
    const nFrames = Math.max(0, Math.floor((x.length - L) / HOP) + 1);
    const db = new Float32Array(nFrames), P = new Float32Array(nFrames);
    const cands = new Array(nFrames);
    const cum = new Float64Array(x.length + 1);
    for (let i = 0; i < x.length; i++) cum[i + 1] = cum[i] + x[i] * x[i];
    const KMPM = 0.94;                      // seuil relatif de McLeod & Wyvill (2005)

    // Corrélation normalisée (NSDF de McLeod) d'une trame ; tampon circulaire de 5 trames.
    const ring = [], ringT = new Int32Array(5).fill(-1);
    for (let q = 0; q < 5; q++) ring.push(new Float32Array(tauMax + 2));
    function nsdfRow(u) {
      const slot = u % 5;
      if (ringT[slot] === u) return ring[slot];
      const row = ring[slot], s0 = u * HOP, e0 = cum[s0 + WIN] - cum[s0];
      db[u] = 10 * Math.log10(e0 / WIN + 1e-12);
      for (let tau = 1; tau <= tauMax + 1; tau++) {
        let acc = 0;
        for (let j = 0; j < WIN; j++) { const v = x[s0 + j] - x[s0 + j + tau]; acc += v * v; }
        const et = cum[s0 + tau + WIN] - cum[s0 + tau];
        row[tau] = e0 + et > 0 ? 1 - acc / (e0 + et) : 0;
      }
      ringT[slot] = u;
      return row;
    }
    const WT = o.noSmooth ? [0, 0, 1, 0, 0] : [1, 2, 3, 2, 1], sm = new Float64Array(tauMax + 2);

    for (let t = 0; t < nFrames; t++) {
      // lobes repérés sur la corrélation lissée sur ±2 trames (moins de variance en voix soufflée) ;
      // sommet fin mesuré sur la trame elle-même (vibrato et glissandos préservés)
      sm.fill(0); let wsum = 0;
      for (let q = -2; q <= 2; q++) {
        const u = t + q; if (u < 0 || u >= nFrames) continue;
        const w = WT[q + 2], row = nsdfRow(u); wsum += w;
        for (let tau = 1; tau <= tauMax + 1; tau++) sm[tau] += w * row[tau];
      }
      for (let tau = 1; tau <= tauMax + 1; tau++) sm[tau] /= wsum;
      const ns = nsdfRow(t), list = [];
      let tz = 1; while (tz <= tauMax && sm[tz] > 0) tz++;
      let lobeMax = -1, lobeTau = -1, rawMax = 0;
      for (let tau = Math.max(tz, 2); tau <= tauMax; tau++) {
        if (sm[tau] > 0 && sm[tau] > lobeMax) { lobeMax = sm[tau]; lobeTau = tau; }
        if ((sm[tau] <= 0 || tau === tauMax) && lobeTau > 0) {
          if (lobeTau >= tauMin && lobeTau < tauMax) {
            let k = lobeTau;
            for (let q = Math.max(2, lobeTau - 2); q <= Math.min(tauMax, lobeTau + 2); q++) if (ns[q] > ns[k]) k = q;
            const n0 = ns[k - 1], n1 = ns[k], n2 = ns[k + 1], dn = n0 - 2 * n1 + n2;
            const off = dn < -1e-12 ? Math.max(-0.5, Math.min(0.5, 0.5 * (n0 - n2) / dn)) : 0;
            const nRaw = dn < -1e-12 ? Math.min(1, n1 - 0.25 * (n0 - n2) * off) : n1;
            const a0 = sm[lobeTau - 1], a1 = sm[lobeTau], a2 = sm[lobeTau + 1], da = a0 - 2 * a1 + a2;
            const so = da < -1e-12 ? Math.max(-0.5, Math.min(0.5, 0.5 * (a0 - a2) / da)) : 0;
            const nSm = da < -1e-12 ? Math.min(1, a1 - 0.25 * (a0 - a2) * so) : a1;
            list.push({ tau: k + off, f: FS / (k + off), n: nSm, nRaw });
            rawMax = Math.max(rawMax, nRaw);
          }

      if (pref) pref.first = true;

      if (pref && !keep.includes(pref)) keep.push(pref);

  /** Hauteur instantanée (pour l'accordeur en direct) sur un bloc récent à 16 kHz. */

    if (W < 200) return null;

  /* ----------------------------------------------- segments et statistiques */

  function movingAvg(arr, w) {

  /** Vibrato et stabilité d'une courbe en demi-tons (midi flottant), pas hop (s). */

  /* ----------------------------------------- alignement forcé sur une cible */
  /**
   * Aligne une courbe de hauteur sur une suite de notes cibles (Viterbi gauche-droite).

        return 0.6 * Math.min(Math.abs(p - (tg[i].midi + off)), 5);

          if (i + 1 < N) relax(s, base[i + 1], 0.3);        // note suivante

  /** Statistiques par note (centre, erreur, attaque, stabilité). */
  function noteStats(track, note, offset) {

    if (!note.frames.length) return Object.assign(res, { missed: true });

    if (fr.length < 4) return Object.assign(res, { missed: true });

  /* ------------------------------------------------ qualité de la voix */
  /** H1-H2 (dB) médian sur les trames voisées stables d'un intervalle. */

   * Différences voulues : seules les trames voisées comptent, et le pic est cherché autour de la

    if (isFinite(q.lo) && isFinite(q.hi) && q.hi <= q.lo) q.hi = q.lo + 1;
    return q;
  };

  /** Choix des paramètres : parmi des candidats, celui dont la difficulté est la plus proche de la cible. */
  C.choose = function (ex, target, ctx, r) {
    let cands = ex.candidates(ctx, r);
    // après « ça forçait » : rien au-dessus du plafond (s'il reste des candidats)
    if (isFinite(ctx.maxNote)) { const low = cands.filter(p => !(C.topOf(p) > ctx.maxNote)); if (low.length) cands = low; }
    let best = null, bd = Infinity;
    const scored = cands.map(p => ({ p, d: ex.difficulty(p, ctx) })).filter(o => isFinite(o.d));
    for (const o of scored) { const e = Math.abs(o.d - target); if (e < bd) { bd = e; best = o; } }
    if (!best) return null;
    // un peu de variété : tirage parmi les candidats à moins de 0,35 du meilleur écart
    const near = scored.filter(o => Math.abs(o.d - target) <= bd + 0.35);
    const o = near.length ? near[Math.floor((r || Math.random)() * near.length) % near.length] : best;
    return { params: o.p, d: o.d };
  };

  }

  /*
   * Oreille fine : estimation bayésienne adaptative du seuil (ZEST, King-Smith et al. 1994).
   * Tâche : le 2e son est-il plus haut ou plus bas ? (hasard = 50 %). Fonction psychométrique de Weibull :
   * P(juste | Δ) = 0,5 + (0,5 − λ)·(1 − exp(−(Δ/θ)^β)), β = 2, λ = 3 % d'inattention. Chaque essai est placé
   * au seuil le plus probable (≈ 80 % de réussite) ; le seuil rapporté est l'écart donnant 75 % de bonnes
   * réponses, avec son intervalle de confiance. Plus précis qu'un escalier 2-bas/1-haut de 12 essais.
   */
  const ZP = { beta: 2, lapse: 0.03, lo: Math.log(2), hi: Math.log(400), n: 161 };
  const zPc = (delta, lnTheta) => 0.5 + (0.5 - ZP.lapse) * (1 - Math.exp(-Math.pow(delta / Math.exp(lnTheta), ZP.beta)));
  const Z75 = Math.pow(-Math.log(1 - 0.25 / (0.5 - ZP.lapse)), 1 / ZP.beta);     // seuil 75 % = θ × Z75
  C.zest = {
    /** prior : seuil attendu (cents) ; sd : incertitude (écart-type du logarithme naturel) */
    init(prior, sd) {
      const grid = [], post = [];
      for (let i = 0; i < ZP.n; i++) { const l = ZP.lo + (ZP.hi - ZP.lo) * i / (ZP.n - 1); grid.push(l); post.push(Math.exp(-0.5 * Math.pow((l - Math.log(prior)) / (sd || 0.8), 2))); }
      const st = { grid, post, n: 0, correct: 0 }; C.zest.norm(st); return st;
    },
    norm(st) { const z = st.post.reduce((a, b) => a + b, 0) || 1; for (let i = 0; i < st.post.length; i++) st.post[i] /= z; },
    /** prochain écart (cents) : moyenne a posteriori du seuil θ */
    next(st) { let m = 0; for (let i = 0; i < st.grid.length; i++) m += st.post[i] * st.grid[i]; return Math.max(3, Math.min(300, Math.exp(m))); },
    update(st, delta, ok) {
      for (let i = 0; i < st.grid.length; i++) { const p = zPc(delta, st.grid[i]); st.post[i] *= ok ? p : 1 - p; }
      C.zest.norm(st); st.n++; if (ok) st.correct++;
    },
    /** seuil à 75 % (cents) et intervalle à 80 % */
    estimate(st) {
      let m = 0, c = 0, q10 = null, q90 = null;
      for (let i = 0; i < st.grid.length; i++) { m += st.post[i] * st.grid[i]; c += st.post[i]; if (q10 == null && c >= 0.1) q10 = st.grid[i]; if (q90 == null && c >= 0.9) q90 = st.grid[i]; }
      return { threshold: Math.exp(m) * Z75, lo80: Math.exp(q10) * Z75, hi80: Math.exp(q90) * Z75, n: st.n, correct: st.correct };
    },
  };

  function patternExercise(o) {
    return Object.assign({
      kind: 'sing', load: 1,
      candidates(ctx) {
        const out = [], pat = C.PATTERNS[o.pattern], top = Math.max(...pat);
        for (const root of noteRange(ctx, o.extraTop == null ? 7 : o.extraTop)) {
          if (root + top > ctx.profile.high + (ctx.rangeShift || 0)) continue;
          if (o.minTop && root + top < o.minTop(ctx)) continue;
          for (const tempo of o.tempos) for (const tol of o.tols) out.push({ root, tempo, tol, pattern: o.pattern, vowel: o.vowel });
        }
        return out;
      },
      label: p => '« ' + p.vowel + ' » · ' + C.patternSpan(p.pattern, p.root) + ' · ♩=' + p.tempo,
      steps(p) {
        const notes = C.PATTERNS[p.pattern].map(x => p.root + x), beat = 60 / p.tempo;
        return [listenSeq(notes, p.tempo, { vowel: p.vowel }), singStep(notes.length * beat + 2.2, { type: 'notes', targets: notes.map(m => ({ midi: m, dur: beat })), tol: p.tol, voice: true }, { countIn: 2, tempo: p.tempo, label: o.singLabel })];
      },
      judge(res, p, ctx) {
        const out = judgeNotes(res, p, ctx, null, { strictOctave: true });
        if (out.y == null) return out;
        if (o.density && res.voice && !res.octave) {
          const mid = isFinite(res.voiceMidi) ? res.voiceMidi : p.root + Math.max(...C.PATTERNS[p.pattern]);
          const dv = densityFb(out.fb, C.densityVerdict(res.voice, mid, ctx, { vowel: C.vowelClass(p.vowel), snr: res.quality && res.quality.snr }), o.densityTip || 'Parle davantage la voyelle : plus proche, plus « bavard ».');
          if (dv && dv.level === 'souffle') { out.y = Math.min(out.y, 0.5); out.success = false; }
        }
        return out;
      },
    }, o);
  }

  /* ------------------------------------------------------------ étapes */
  /** Première note d'un modèle. */
  const firstMidi = play => (play.kind === 'note' ? play.midi : play.kind === 'seq' ? play.notes[0] : play.kind === 'glide' || play.kind === 'glide-loop' ? play.from : null);
  /** Réglage du volume pendant l'écoute (le son est un peu bas sur iPhone quand le micro est ouvert). */
  const volRow = () => `<div class="row" style="justify-content:center;gap:8px">${btn('vol', '🔉 −', 'small ghost', '-0.25')}<span class="small muted">Volume ${Math.round(100 * (S().profile.volume || 1))} %</span>${btn('vol', '🔊 +', 'small ghost', '0.25')}</div>`;
  function stepVolume(delta) {
    const p = S().profile;
    p.volume = Math.max(0.5, Math.min(2, Math.round(((p.volume || 1) + delta) * 100) / 100));
    A.setUserVolume(p.volume); save();
  }
  async function stepListen(st, params, head, okLabel) {
    const timbre = S().profile.timbre === 'piano' ? 'piano' : 'voix';
    const opt = () => ({ timbre: st.play.timbre || timbre, vowel: st.vowel || params.vowel });
    // dans un bloc, une note de départ éloignée de la précédente est annoncée : sinon on la compare
    // naturellement à l'exemple d'avant, et elle « sonne faux »
    const fm = st.noReplay ? null : firstMidi(st.play);
    const moved = fm != null && R.block && R.block.lastRef != null && Math.abs(fm - R.block.lastRef) >= 3;
    if (fm != null && R.block) R.block.lastRef = fm;
    await ensureSound(head);
    frame(stage(st.label || 'Écoute', moved ? 'Nouvelle note de départ : oublie la précédente.' : 'Écoute une fois, attentivement.', '<div class="pulse"></div>'), '', head);
    await A.play(st.play, opt());
    const ready = () => frame(stage(st.label || 'Écoute', moved ? 'Prêt ? (nouvelle note de départ)' : 'Prêt ?', '<div class="pulse" style="animation:none;opacity:.5"></div>'),
      btn('listen-ok', okLabel || 'À moi', 'primary big block') + (st.noReplay ? '' : btn('replay-model', 'Réécouter', 'ghost block')) + volRow(), head);
    ready();
    for (;;) {
      const a = await U.wait(['listen-ok', 'replay-model', 'vol']);
      if (a.act === 'listen-ok') return;
      if (a.act === 'vol') { stepVolume(+a.arg); ready(); continue; }
      if (!A.running()) { await ensureSound(head); ready(); }
      await A.play(st.play, opt());
    }
  }

  async function stepWait(st, head) {
    const t0 = Date.now(), sec = st.sec;
    frame(stage(st.label, '', U.ring(0, Math.ceil(sec))), '', head);
    for (;;) {
      const left = sec - (Date.now() - t0) / 1000;
      if (left <= 0) break;
      const ring = el.querySelector('.stage .ring'); if (ring) ring.outerHTML = U.ring(1 - left / sec, Math.ceil(left));
      await U.sleep(250);
      if (R.aborted) throw ABORT;
    }
  }

  async function stepRoutine(st, head) {
    const kw = S().routineWord || 'Raconte';
    const phases = [['Inspire lentement… 4 temps', 4], ['Expire longuement… 6 temps', 6], ['Inspire… 4', 4], ['Expire… 6', 6], ['Inspire… 4', 4], ['Expire… 6', 6], ['Ton mot-clé : « ' + kw + ' »', 5], ['Entends ta première phrase dans ta tête, à tempo', 8]];
    let skip = false;
    frame(stage(phases[0][0], 'Routine d’avant scène', U.ring(0, '')), btn('routine-skip', 'Je suis prêt', 'ghost block'), head);
    U.wait(['routine-skip']).then(a => { if (a) skip = true; }).catch(() => {});
    try {
      for (const [label, sec] of phases) {
        const t0 = Date.now();
        const lab = el.querySelector('.stage .label'); if (lab) lab.textContent = label;
        while ((Date.now() - t0) / 1000 < sec) {
          const ring = el.querySelector('.stage .ring'); if (ring) ring.outerHTML = U.ring((Date.now() - t0) / 1000 / sec, '');
          await U.sleep(250);
          if (skip) return;
          if (R.aborted) throw ABORT;
        }
      }
    } finally { U.cancel(['routine-skip']); }
  }

  /** Enregistrement d'une prise : compte, micro ouvert, arrêt auto, analyse. */
  async function stepRecord(ex, st, params, head) {
    const spec = st.rec.spec, maxSec = st.rec.sec, target = st.timer || st.hold || maxSec;
    if (!R.mic) {
      await countdown(st, head);
      await timedPhase(st.label + ' (sans micro)', target, head, null);
      return { res: null };
    }
    await ensureSound(head);
    if (!A.micAlive()) { try { await A.openMic(); } catch (e) { /* on tente quand même : « je ne t'ai pas entendu » */ } }
    let peak = -120, heard = false, quietSince = 0;
    const noise = A.level(), hid0 = R.hidden;
    A.startRec();
    if (st.countIn) {
      frame(stage('Prépare-toi…', st.label, '<div class="rec-dot"></div>'), '', head);
      await A.clicks(st.countIn, st.tempo);
    } else {
      frame(stage('Prêt…', st.label, '<div class="rec-dot"></div>'), '', head);
      await U.sleep(700);
    }
    const t0 = Date.now();
    let stopped = false;
    const drawRec = () => {
      const el0 = (Date.now() - t0) / 1000, lv = A.level();
      peak = Math.max(peak, lv);
      const loud = lv > Math.min(-42, Math.max(noise + 15, -55));
      if (loud) { heard = true; quietSince = 0; } else if (heard && !quietSince) quietSince = Date.now();
      const w = Math.max(0, Math.min(100, (lv + 60) / 60 * 100));
      const ring = st.timer ? U.ring(Math.min(1, el0 / st.timer), Math.floor(el0) + ' s') : U.ring(Math.min(1, el0 / target), Math.max(0, Math.ceil(target - el0)));
      const body = document.getElementById('sessBody');
      const html = stage(st.label, (heard ? 'Je t’entends ✓' : 'Chante…') + `<div class="meter" style="margin:10px auto 0"><b style="width:${w}%"></b></div>`, ring);
      if (body && body.dataset.rec === '1') body.querySelector('.stage').outerHTML = html;
      else { frame(html, btn('rec-stop', 'J’ai fini', 'ghost block'), head); document.getElementById('sessBody').dataset.rec = '1'; }
      return el0;
    };
    drawRec();
    await new Promise(resolve => {
      const iv = setInterval(() => {
        if (R.aborted) { clearInterval(iv); resolve(); return; }
        const el0 = drawRec();
        const silenceStop = st.stopOnSilence && heard && quietSince && Date.now() - quietSince > 1300;
        const autoStop = !st.stopOnSilence && el0 >= maxSec;
        if (el0 >= maxSec || silenceStop || autoStop || stopped) { clearInterval(iv); resolve(); }
      }, 100);
      U.wait(['rec-stop']).then(a => { if (a) stopped = true; }).catch(() => {});
    });
    U.cancel(['rec-stop']);
    const { pcm, sr } = A.stopRec();
    if (R.aborted) throw ABORT;
    if (R.hidden !== hid0) {
      // écran verrouillé ou app quittée pendant la prise : le micro était coupé, la mesure serait fausse
      frame(stage('Prise interrompue', 'L’écran s’est verrouillé ou l’app est passée en arrière-plan : cette prise ne compte pas.', '<div style="font-size:44px">⏸</div>'), btn('retake', 'Refaire la prise', 'primary big block'), head);
      await U.wait(['retake']);
      return { interrupted: true };
    }
    frame(stage('Analyse…', '', '<div class="pulse"></div>'), '', head);
    await U.frame();
    let res = null;
    try { res = D.analyzeTake(pcm, sr, Object.assign({ a4: A.tuning }, spec)); } catch (e) { console.error(e); res = null; }
    R.lastRec = { pcm, sr };
    return { res, pcm, sr };
  }

  async function countdown(st, head) {
    if (st.countIn) { frame(stage('Prépare-toi…', st.label), '', head); await A.clicks(st.countIn, st.tempo); }
    else { for (const n of [3, 2, 1]) { frame(stage(String(n), st.label), '', head); await U.sleep(600); } }
  }
  async function timedPhase(label, sec, head) {
    const t0 = Date.now();
    frame(stage(label, '', U.ring(0, Math.ceil(sec))), btn('rec-stop', 'J’ai fini', 'ghost block'), head);
    await Promise.race([U.sleep(sec * 1000), U.wait(['rec-stop'])]);
    U.cancel(['rec-stop']);
  }

  /* ------------------------------------------------------------ oreille fine (quiz) */
  async function runDiscri(st, head) {
    // estimation bayésienne adaptative du seuil (ZEST) : chaque écart est placé là où la mesure est la plus
    // informative ; voyelle « a », riche en harmoniques, pour une hauteur bien nette
    const z = C.zest.init(st.start || 30, 0.8), pair = (base, up, cents) => ({ a: { kind: 'note', midi: base, dur: 0.8 }, b: { kind: 'note', midi: base + (up ? 1 : -1) * cents / 100, dur: 0.8 } });
    const playPair = async q => { await A.play(q.a, { timbre: 'voix', vowel: 'a' }); await U.sleep(250); await A.play(q.b, { timbre: 'voix', vowel: 'a' }); };
    for (let i = 0; i < st.trials; i++) {
      const cents = C.zest.next(z);
      const base = st.note + Math.floor(Math.random() * 7) - 3;
      const up = Math.random() < 0.5, q = pair(base, up, cents);
      await ensureSound(head);
      frame(stage('Écoute les deux sons', 'Essai ' + (i + 1) + '/' + st.trials + ' · écart ' + Math.round(cents) + ' cents', '<div class="pulse"></div>'), '', head);
      await U.sleep(300);
      await playPair(q);
      frame(stage('Le 2ᵉ son était…', 'Essai ' + (i + 1) + '/' + st.trials), `<div class="predict">${btn('q-ans', '▲ Plus haut', 'big', 'up')}${btn('q-ans', '▼ Plus bas', 'big', 'down')}</div>` + btn('q-replay', 'Réécouter', 'ghost small'), head);
      let a;
      for (;;) {
        a = await U.wait(['q-ans', 'q-replay']);
        if (a.act === 'q-ans') break;
        await ensureSound(head);
        await playPair(q);
      }
      const ok = (a.arg === 'up') === up;
      C.zest.update(z, cents, ok);
      frame(stage(ok ? '✓ Oui' : '✗ Non', ok ? '' : 'C’était ' + (up ? 'plus haut' : 'plus bas') + '.'), '', head);
      await U.sleep(650);
    }
    const est = C.zest.estimate(z);
    return { threshold: est.threshold, lo80: est.lo80, hi80: est.hi80, correct: est.correct, n: est.n, pc: est.correct / Math.max(1, est.n) };
  }

  /* ------------------------------------------------------------ chanson */
  async function stepSong(ex, st, head) {
    const s = S(), song = s.songs.find(x => x.id === s.workSong) || s.songs[0] || { id: 's0', title: 'ta chanson' };
    const prevList = await Store.listRecs(r => r.kind === 'song' && r.song === song.id);
    const intro = st.pressure
      ? `<div class="notice">Une seule prise, du début à la fin. Si tu te trompes, continue comme sur scène.</div>`
      : `<p class="muted">Chante une phrase (ou un couplet) de « ${U.esc(song.title)} » en appliquant la consigne du jour.</p>`;
    frame(intro + stage(st.pressure ? 'Quand tu es prêt : c’est ta prise' : 'Ta phrase', '', `<div style="font-size:54px">🎤</div>`), btn('song-rec', '● Enregistrer', 'primary big block') + (prevList.length ? btn('song-prev', '▶ Écouter ma dernière prise', 'ghost block') : ''), head);
    for (;;) {
      const a = await U.wait(['song-rec', 'song-prev']);
      if (a.act === 'song-rec') { A.stopAll(); break; }
      A.stopAll();
      const r = await Store.getRec(prevList[0].id); if (r) A.playPcm(r.pcm, r.sr).catch(() => {});   // écoute sans bloquer les boutons
    }
    let res = null, pcm = null, sr = 48000;
    if (R.mic) {
      if (st.pressure) for (const n of [3, 2, 1]) { frame(stage(String(n), 'Silence dans la salle…', '<div class="rec-dot"></div>'), '', head); await U.sleep(900); if (R.aborted) throw ABORT; }
      await ensureSound(head);
      if (!A.micAlive()) { try { await A.openMic(); } catch (e) { /* on tente quand même */ } }
      const t0 = Date.now(), hid0 = R.hidden;
      let iv = null;
      try {
        A.startRec();
        iv = setInterval(() => { const b = document.getElementById('sessBody'); if (b) { const t = Math.floor((Date.now() - t0) / 1000); const lab = b.querySelector('.label'); if (lab) lab.textContent = 'Enregistrement… ' + t + ' s'; } }, 500);
        frame(stage('Enregistrement… 0 s', 'Chante !', '<div class="rec-dot"></div>'), btn('song-stop', '■ Arrêter', 'primary big block'), head);
        await Promise.race([U.wait(['song-stop']), U.sleep(st.rec.sec * 1000)]);
      } finally {
        U.cancel(['song-stop']);
        clearInterval(iv);
        const r = A.stopRec(); pcm = r.pcm; sr = r.sr;
      }
      if (R.hidden !== hid0) U.toast('L’enregistrement a été coupé (écran verrouillé ou app quittée).', 3500);
      if (pcm.length >= sr * 0.5) {
        frame(stage('Analyse…', '', '<div class="pulse"></div>'), '', head); await U.frame();
        try { res = D.analyzeTake(pcm, sr, Object.assign({ a4: A.tuning }, st.rec.spec)); } catch (e) { res = null; }
        try { const x16 = D.resample(pcm, sr, 16000); await Store.saveRec(x16, { ex: ex.id, kind: 'song', song: song.id, label: song.title + (st.pressure ? ' · simulation' : '') }); if (U.invalidateRecs) U.invalidateRecs(); } catch (e) { /* stockage plein */ }
      } else pcm = null;
    } else {
      await timedPhase('Chante ta phrase', 40, head);
    }
    // réécoute et auto-évaluation guidée
    const judged = res ? ex.judge(res, {}, St.ctx(s, R.plan)) : { fb: [] };
    const crit = [['justesse', 'Justesse'], ['densite', 'Son plein, pas soufflé'], ['souffle', 'Souffle jusqu’au bout des phrases'], ['intention', 'Intention, texte vivant']];
    const chosen = new Set();
    const draw = () => frame(
      `<div class="card flat">${(judged.fb || []).map(f => `<div class="fb ${f.kind}"><span class="dot"></span><span>${U.esc(f.text)}</span></div>`).join('') || '<p class="small muted">Écoute-toi et coche ce qui était réussi.</p>'}</div>
      <h3>Ce qui était réussi</h3><div class="chips">${crit.map(([k, l]) => `<button class="chip ${chosen.has(k) ? 'on' : ''}" data-act="crit" data-arg="${k}">${l}</button>`).join('')}</div>` +
      (st.pressure ? `<h3>Stress ressenti</h3><div class="chips">${[1, 2, 3, 4, 5].map(v => `<button class="chip ${R.stress === v ? 'on' : ''}" data-act="stress" data-arg="${v}">${v}</button>`).join('')}</div><p class="tiny faint">1 = serein · 5 = très stressé. Suivre ce chiffre montre l’habituation à la pression.</p>` : ''),
      (pcm && pcm.length ? btn('song-play', '▶ Réécouter', 'block') : '') + btn('song-done', 'Valider', 'primary big block'), head);
    R.stress = null; draw();
    for (;;) {
      const a = await U.wait(['crit', 'song-play', 'song-done', 'stress']);
      if (a.act === 'crit') { chosen.has(a.arg) ? chosen.delete(a.arg) : chosen.add(a.arg); draw(); }
      else if (a.act === 'stress') { R.stress = +a.arg; draw(); }
      else if (a.act === 'song-play') { A.stopAll(); A.playPcm(pcm, sr).catch(() => {}); }
      else { A.stopAll(); break; }
    }
    if (st.pressure && R.stress) St.addSeries(s, 'stress', R.stress);
    return { res, pcm, sr, self: chosen.size >= 3 ? 1 : chosen.size >= 2 ? 0.5 : 0 };
  }

  /* ------------------------------------------------------------ prédiction et auto-évaluation */
  async function askPredict(kind, head) {
    const opts = kind === 'sustain' ? [['juste', 'Juste'], ['bas', 'Trop bas'], ['haut', 'Trop haut'], ['?', 'Je ne sais pas']] : [['juste', 'Toutes justes'], ['faux', 'Au moins une fausse'], ['?', 'Je ne sais pas']];
    frame(stage('Avant de voir : c’était…', 'Deviner d’abord entraîne ton oreille interne — c’est elle qui te guide sur scène.'), `<div class="predict">${opts.map(([v, l]) => btn('pred', l, v === '?' ? 'ghost' : '', v)).join('')}</div>`, head);
    const a = await U.wait(['pred']);
    return a.arg;
  }
  async function askSelf(head, fb) {
    const why = (fb || []).map(f => `<div class="fb ${f.kind}"><span class="dot"></span><span>${U.esc(f.text)}</span></div>`).join('');
    frame((why ? `<div class="card flat">${why}</div>` : '') + stage('Comment c’était pour toi ?', R.mic ? 'La mesure n’a pas pu trancher : ton ressenti compte (à moitié).' : 'Sans micro, c’est ton ressenti qui guide la suite.'),
      `<div class="predict">${btn('self', '✓ Réussi', 'good big', '1')}${btn('self', '~ Presque', 'warnb big', '0.5')}</div>${btn('self', '✗ Raté ou forcé', 'badb block', '0')}`, head);
    const a = await U.wait(['self']);
    return +a.arg;
  }

  /* ------------------------------------------------------------ résultat */
  async function showResult(ex, params, res, judged, take, rec, head) {
    const y = judged.y != null ? judged.y : take.self;
    const win = judged.success === true || (judged.success == null && y >= 1);
    const vcls = y == null ? 'none' : win ? 'good' : y >= 0.5 ? 'half' : 'bad';
    const vtxt = y == null ? 'Enregistré' : win ? 'Réussi' : y >= 0.5 ? 'Presque' : 'Pas encore';
    const fb = (judged.fb || []).slice(0, 4);
    if (take.calib) fb.unshift({ kind: take.calib.hit ? 'good' : 'warn', text: take.calib.hit ? 'Oreille interne : bien senti ✓' : 'Oreille interne : c’était « ' + ({ juste: 'juste', bas: 'trop bas', haut: 'trop haut', faux: 'faux' })[take.calib.truth] + ' »' });
    const spec = ex.steps(params, St.ctx(S(), R.plan)).filter(s => s.rec && s.t === 'sing').pop();
    const specType = spec && spec.rec && spec.rec.spec ? spec.rec.spec.type : '';
    const plot = res && res.track && ex.kind === 'sing' && specType !== 'mpt' && specType !== 'hiss' ? U.plotTake(res, spec && spec.rec.spec) : '';
    const fbHtml = fb.map(f => `<div class="fb ${f.kind}"><span class="dot"></span><span>${U.esc(f.text)}</span></div>`).join('');
    const draw = () => frame(`<div class="center"><div class="verdict ${vcls}">${vtxt}</div></div>${plot}<div class="card flat">${fbHtml || '<p class="muted small">—</p>'}</div>` +
      `<div class="row wrap">${rec && rec.pcm && rec.pcm.length ? btn('res-play', '▶ Ma prise', 'small') : ''}${btn('res-retry', '↺ Refaire', 'small')}${btn('res-strain', R.strainMark ? '⚠︎ Noté : ça forçait' : 'Ça forçait', 'small ghost')}${judged.y != null ? btn('res-dispute', 'Mesure fausse ?', 'small ghost') : ''}</div>`,
      btn('res-next', 'Suivant', 'primary big block'), head);
    R.strainMark = false; draw();
    for (;;) {
      const a = await U.wait(['res-next', 'res-retry', 'res-play', 'res-strain', 'res-dispute']);
      if (a.act === 'res-play') { A.stopAll(); A.playPcm(rec.pcm, rec.sr).catch(() => {}); continue; }   // les boutons restent actifs pendant l'écoute
      A.stopAll();
      if (a.act === 'res-strain') {
        if (!R.strainMark) {
          R.strainMark = true;
          // une prise forcée n'est pas une réussite (pour les registres, c'est un échec)
          const cap = ['aigu', 'passage', 'poitrine'].includes(ex.comp) ? 0 : 0.5;
          const j2 = Object.assign({}, judged, { y: judged.y != null ? Math.min(judged.y, cap) : null, success: false });
          reviseLast(ex, j2, take.self != null ? Math.min(take.self, cap) : null);
          R.last.entry.strain = true;
          // la suite : un demi-ton plus bas au maximum, plus facile, et on arrête de monter
          const top = C.topOf(params);
          if (isFinite(top)) R.block.capTop = Math.min(R.block.capTop != null ? R.block.capTop : Infinity, top - 1);
          R.block.shift = Math.max(-3, R.block.shift - 1);
          R.block.offset += 0.6;
          if (R.block.ladder) R.block.ladder.stop = true;
          if (R.item && R.item.fixed) R.block.stop = true;
        }
        U.toast('Noté : la suite sera plus basse et plus facile. Moins de force, plus de brillance.'); draw(); continue;
      }
      if (a.act === 'res-dispute') {
        const self = await askSelf(head, [{ kind: 'info', text: 'Dis-moi comment c’était vraiment : ta réponse remplace la mesure pour cette prise.' }]);
        // la mesure est retirée ; ton ressenti la remplace (il compte à moitié, comme toute auto-évaluation)
        reviseLast(ex, { y: null, success: null, metrics: null, fb: [] }, self, { res: null, pre: [], predicted: null });
        R.last.entry.disputed = true;
        U.toast('Merci : noté comme ' + (self === 1 ? 'réussi' : self > 0 ? 'presque' : 'raté') + '.');
        return 'next';
      }
      if (a.act === 'res-retry') { R.retryParams = R.strainMark ? C.transpose(params, -1) : params; R.retryEx = ex.id; return 'retry'; }
      return 'next';
    }
  }

  /* ------------------------------------------------------------ fin */
  async function endSession(aborted) {
    const s = S();
    A.stopAll();
    try { A.closeMic(); } catch (e) { /* rien */ }
    releaseAwake();
    const sess = R.sess;
    sess.activeMs = activeMs();
    const measured = sess.takes.filter(t => !t.guided && (t.judged && t.judged.y != null || t.self != null));
    // interrompue avant la fin : gardée pour reprise (sauf exercice libre de la bibliothèque)
    const resumable = aborted && R.plan.type !== 'libre' && R.idx < R.plan.items.length;
    let summary = null;
    if (measured.length || !aborted) {
      const done = St.finishSession(s, sess, null, resumable);
      done.load = Math.round((sess.load || 0) * 1.5 + (done.minutes || 0) * 0.5);
      if (R.plan.type === 'B' && !aborted) {
        summary = P.concludeBilan(s, sess, R.plan.bilan);
        if (R.plan.bilan === 'entree') { s.program.start = St.today(); s.program.pausedDays = 0; }   // le programme démarre vraiment ici
      }
      if (s.program.reprise && P.mainSessions(s).length >= s.program.reprise) s.program.reprise = 0;
    }
    s.current = resumable ? { plan: R.plan, sess, idx: R.idx, elapsed: sess.activeMs, date: St.today() } : null;
    Store.save(s, true);
    const ok = measured.filter(takeWon).length;
    const plan = R.plan;
    R = null;
    // écran de fin
    const box = el;
    U.resetAbort();
    const lines = [];
    if (measured.length) lines.push(`<div class="stat"><span class="muted small">Prises réussies</span><b>${ok}/${measured.length}</b></div>`);
    lines.push(`<div class="stat"><span class="muted small">Durée</span><b>${Math.max(1, Math.round((sess.activeMs || 0) / 60000))} min</b></div>`);

   * Vérification de bout en bout : le téléphone joue deux notes du modèle et les réécoute au micro. Si la

   * fréquence d'échantillonnage changée par iOS…) : on le dit, plutôt que de laisser croire à une fausse note.
   */
  let loopMsg = '';
  U.on('loop-test', async () => {
    const p = S().profile, notes = [p.comfortLow + 5, p.comfortLow + 12];
    try {
      A.tuning = p.tuning || 440; A.setUserVolume(Math.max(1, p.volume || 1));
      U.toast('Vérification : pose le téléphone, sans écouteurs, et reste silencieux 5 s…', 5000);

      for (const m of notes) { await A.play({ kind: 'note', midi: m, dur: 1.4 }, { timbre: 'voix', vowel: 'a' }); await U.sleep(300); }
      await U.sleep(300);
      const { pcm, sr } = A.stopRec(); A.closeMic();
      const res = D.analyzeTake(pcm, sr, { type: 'notes', targets: notes.map(m => ({ midi: m, dur: 1.4 })), tol: 10, a4: p.tuning || 440 });
      const errs = (res.notes || []).filter(n => !n.missed && isFinite(n.err)).map(n => n.err);
      if (!res.ok || errs.length < 2) loopMsg = 'Je n’entends pas le haut-parleur : monte le volume, retire les écouteurs, et autorise le micro.';

      }

    U.toast(loopMsg, 5000);

  function science() {
    let h = `<header class="topbar"><button class="iconbtn" data-act="tab" data-arg="settings" aria-label="Retour">‹</button><h1 class="grow">Comment ça marche</h1></header><section class="screen">`;
    h += `<div class="card"><h3>Ce que mesure le micro</h3><ul class="small" style="margin:8px 0 0;padding-left:18px">
      <li><b>Justesse</b> : suivi de hauteur (corrélation normalisée + contrôle spectral des octaves + chemin le plus probable), dans le diapason choisi. Testé : précision ±3 cents, 0 erreur d’octave, fiable même dans le bruit. Une note tenue avec vibrato est jugée sur son centre, comme l’entend l’oreille.</li>
      <li><b>Densité du son</b> : CPPS (proéminence du pic cepstral), la mesure de référence du souffle dans la voix, calculée comme Praat (écart médian &lt; 1 dB). Elle dépend aussi de la hauteur, de la voyelle, du volume et du bruit : elle n’est comparée qu’à <i>tes</i> prises comparables (même voyelle, même zone, volume proche), et seulement si la pièce est assez calme. Dans « Du parlé au chanté », ton « a ! » parlé et ton « a » chanté sont comparés à même hauteur.</li>
      <li><b>Fermeture glottique</b> : H1–H2 (plus haut = plus d’air).</li>
      <li><b>Cassures</b> dans les sirènes, <b>attaques</b> soufflées, <b>vibrato</b> (vitesse, amplitude), <b>trous</b> dans le legato, durées de souffle.</li>
      <li>Si la voix est trop soufflée ou la pièce trop bruyante pour mesurer de façon sûre, TIMBRE le dit et ne note pas.</li></ul></div>`;
    h += `<div class="card"><h3>Comment tu progresses</h3><ul class="small" style="margin:8px 0 0;padding-left:18px">
      <li>Chaque compétence a un niveau estimé ; chaque exercice est généré pour que tu réussisses environ 4 prises sur 5.</li>
      <li>Retour après la prise (jamais pendant), bref, centré sur une chose ; parfois tu devines d’abord.</li>
      <li>Un exercice nouveau se travaille d’abord en bloc ; une fois connu, il alterne avec un autre de la même compétence (mieux retenu). Compétences revues à intervalles réguliers, bilans toutes les 4 semaines (rattrapés si tu les manques).</li>
      <li>Les modèles : voix de synthèse aux formants fixes (le même timbre seule ou dans une mélodie), sans vibrato (plus facile à imiter juste), notes graves rendues nettes sur haut-parleur. Volume réglable.</li>
      <li>Forme du jour, charge vocale, pauses et échéance ajustent la séance.</li></ul></div>`;
    h += `<div class="card"><h3>Santé vocale</h3><ul class="small" style="margin:8px 0 0;padding-left:18px"><li>Douleur en chantant : on arrête.</li><li>Enrouement qui dure plus de deux semaines : consulte un ORL ou un phoniatre.</li><li>Voix fatiguée : travail très doux (paille, bouche fermée) plutôt que forcer ou chuchoter.</li><li>Hydratation, sommeil, et pas de gros volume la veille d’une échéance.</li></ul></div>`;
    h += `<div class="card"><h3>Sources</h3><ol class="small" style="margin:8px 0 0;padding-left:18px">${U.SOURCES.map(([ref, why]) => `<li style="margin-bottom:8px">${esc(ref)}<br><span class="faint">${esc(why)}</span></li>`).join('')}</ol></div>`;
    h += '</section>';
    return h;
  }

      <div class="card hero"><div class="row between"><div><div class="small muted">Niveau global estimé</div><div class="big-num">${fr(ov)}</div><div class="muted">${esc(M.label(ov))}</div></div><div class="tag accent">16 semaines</div></div>
      <div class="col" style="margin-top:14px">${M.COMPS.map(c => { const sk = s.skills[c.id]; return `<div class="skill"><span>${esc(c.short)}</span><div class="bar"><u style="left:${Math.max(0, sk.th - sk.sd) * 10}%;width:${Math.min(20, 2 * sk.sd) * 10}%"></u><b style="width:${sk.th * 10}%"></b></div><span class="small" style="text-align:right">${fr(sk.th)}</span></div>`; }).join('')}</div>
      <p class="tiny faint" style="margin-top:10px">Estimation prudente (bande claire = incertitude). VOIX ne mesurait pas la justesse : le bilan d’entrée, au micro, tranchera.</p></div>
      <div class="card"><h3>Le programme</h3><div class="col small" style="margin-top:8px">${P.BLOCKS.map(b => `<div><b>Semaines ${b.from}–${b.to} · ${esc(b.name)}</b><div class="muted">${esc(b.goal)}</div></div>`).join('')}</div></div>
      <div class="card"><h3>Réglages rapides</h3><div class="col" style="margin-top:8px"><label class="field">Durée des séances<select data-change="prof-num" data-arg="sessionMin">${[15, 20, 25, 30, 40].map(v => `<option value="${v}" ${s.profile.sessionMin === v ? 'selected' : ''}>${v} min</option>`).join('')}</select></label><label class="field">Séances par semaine<select data-change="prof-num" data-arg="daysPerWeek">${[3, 4, 5, 6].map(v => `<option value="${v}" ${s.profile.daysPerWeek === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div></div>
      ${btn('onb-done', 'C’est parti', 'primary big block')}</section>`;
  }
  U.on('onb', v => { onbStep = +v; U.render(); });
  U.on('onb-preset', () => {
    const s = S(), pre = TB.PRESET;
    I.apply(s, { skills: pre.skills, profile: pre.profile, summary: pre.summary });
    onbStep = 2; save(); U.render();
  });
  U.on('onb-fresh', () => { onbStep = 2; U.render(); });
  U.on('onb-local', () => {
    const loc = I.readVoixLocal(); if (!loc) return;
    const res = I.fromVoix(loc, TB.PRESET ? TB.PRESET.statements : {});
    I.apply(S(), res); onbStep = 2; save(); U.render();
    U.toast('Niveau estimé : ' + fr(res.summary.overall) + ' (' + res.summary.label + ')', 3000);
  });
  U.on('onb-done', () => { const s = S(); s.onboarded = true; s.program.start = St.today(); save(); Store.persist(); screen = 'home'; U.render(); window.scrollTo(0, 0); });
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* TIMBRE — démarrage. */
(function (root) {
  'use strict';
  const TB = root.TB, U = TB.ui, St = TB.state, Store = TB.store;
  let state = null;
  U.state = () => state;
  U.setState = s => { state = St.migrate(s); Store.save(state, true); };
  function boot() {
    let s = null;
    try { s = Store.load(); } catch (e) { s = null; }
    state = s ? St.migrate(s) : St.newState();
    U.applyTheme();
    if (TB.audio) { TB.audio.tuning = state.profile.tuning || 440; TB.audio.setUserVolume(state.profile.volume || 1); }
    let warned = false;
    Store.onError = () => { if (!warned) { warned = true; U.toast('Sauvegarde impossible (mémoire du navigateur pleine ?). Exporte tes données dans Réglages.', 6000); } };
    U.render();
    // sauvegarde immédiate quand l'app passe en arrière-plan (iPhone)
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
    root.addEventListener('pagehide', () => Store.flush());
    // un nouveau jour : la carte d'accueil se remet à jour au retour dans l'app
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !U.inSession()) U.render(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);
